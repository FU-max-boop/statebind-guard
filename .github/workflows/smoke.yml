name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build backend
        run: python -m pip install "setuptools>=77"
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Run public-ready check
        run: bash scripts/check_public_ready.sh

  compatibility:
    name: compatibility (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build backend
        run: python -m pip install "setuptools>=77"
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Run clean wheel package smoke
        run: make package-check

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create valid handoff fixture
        run: |
          cat > HANDOFF.md <<'EOF'
          # Agent Handoff

          ## Active Target
          - Type: ci
          - Handle: make test
          - Evidence: workflow smoke fixture
          - Confidence: high

          ## Executable Bindings
          | Role | Handle | Evidence | Confidence | Risk |
          |---|---|---|---|---|
          | next_command | `make test` | workflow smoke fixture | high | |

          ## Next Action
          1. Run the bound validation command.

          ## Risks
          - none
          EOF
          cat > statebind.json <<'EOF'
          {
            "schema_version": "0.1",
            "task": {
              "goal": "verify the StateBind GitHub Action",
              "status": "ready"
            },
            "active_target": {
              "type": "ci",
              "handle": "make test",
              "evidence": "workflow smoke fixture",
              "confidence": "high"
            },
            "bindings": [
              {
                "role": "next_command",
                "handle": "make test",
                "evidence": "workflow smoke fixture",
                "confidence": "high",
                "risk": ""
              }
            ],
            "risks": []
          }
          EOF
          cat > .statebind-policy.json <<'EOF'
          {
            "schema_version": "0.1",
            "required_roles": ["next_command"],
            "min_confidence": "high",
            "require_top_level_risks": false
          }
          EOF
      - name: Run local composite action
        id: statebind
        uses: ./
        with:
          handoff: HANDOFF.md
          statebind-json: statebind.json
          policy: .statebind-policy.json
          fail-on: warning
      - name: Check action reports
        env:
          STATEBIND_PASSED: ${{ steps.statebind.outputs.passed }}
          STATEBIND_ERRORS: ${{ steps.statebind.outputs.errors }}
          STATEBIND_WARNINGS: ${{ steps.statebind.outputs.warnings }}
          STATEBIND_EXIT_CODE: ${{ steps.statebind.outputs.exit_code }}
        run: |
          test "$STATEBIND_PASSED" = "true"
          test "$STATEBIND_ERRORS" = "0"
          test "$STATEBIND_WARNINGS" = "0"
          test "$STATEBIND_EXIT_CODE" = "0"
          test -s statebind-validation.json
          test -s statebind-validation.sarif
          test -s statebind-summary.md
          test -s statebind-report.html
          python -m json.tool statebind-validation.json >/dev/null
          python -m json.tool statebind-validation.sarif >/dev/null
          grep -q "StateBind Guard" statebind-summary.md
          grep -q "StateBind Guard Report" statebind-report.html
      - name: Create invalid handoff fixture
        run: |
          cat > statebind-invalid.json <<'EOF'
          {
            "schema_version": "0.1",
            "task": {
              "goal": "verify failed StateBind Action routing",
              "status": "blocked"
            },
            "active_target": {
              "type": "test",
              "handle": "pytest tests/test_router.py::test_stream_response",
              "evidence": "workflow negative smoke fixture",
              "confidence": "high"
            },
            "bindings": [
              {
                "role": "failing_test",
                "handle": "the previous command",
                "evidence": "workflow negative smoke fixture",
                "confidence": "high",
                "risk": ""
              }
            ],
            "risks": []
          }
          EOF
          cat > .statebind-invalid-policy.json <<'EOF'
          {
            "schema_version": "0.1",
            "required_roles": ["failing_test"],
            "min_confidence": "high",
            "require_top_level_risks": false
          }
          EOF
      - name: Run local composite action on invalid handoff
        id: statebind_invalid
        uses: ./
        continue-on-error: true
        with:
          statebind-json: statebind-invalid.json
          policy: .statebind-invalid-policy.json
          fail-on: warning
          report: statebind-invalid-validation.json
          sarif: statebind-invalid-validation.sarif
          summary: statebind-invalid-summary.md
          html-report: statebind-invalid-report.html
      - name: Check failed action reports
        env:
          STATEBIND_INVALID_OUTCOME: ${{ steps.statebind_invalid.outcome }}
          STATEBIND_INVALID_PASSED: ${{ steps.statebind_invalid.outputs.passed }}
          STATEBIND_INVALID_ERRORS: ${{ steps.statebind_invalid.outputs.errors }}
          STATEBIND_INVALID_WARNINGS: ${{ steps.statebind_invalid.outputs.warnings }}
          STATEBIND_INVALID_EXIT_CODE: ${{ steps.statebind_invalid.outputs.exit_code }}
        run: |
          test "$STATEBIND_INVALID_OUTCOME" = "failure"
          test "$STATEBIND_INVALID_PASSED" = "false"
          test "$STATEBIND_INVALID_ERRORS" = "1"
          test "$STATEBIND_INVALID_WARNINGS" = "1"
          test "$STATEBIND_INVALID_EXIT_CODE" = "1"
          test -s statebind-invalid-validation.json
          test -s statebind-invalid-validation.sarif
          test -s statebind-invalid-summary.md
          test -s statebind-invalid-report.html
          python -m json.tool statebind-invalid-validation.json >/dev/null
          python -m json.tool statebind-invalid-validation.sarif >/dev/null
          grep -q "vague_handle" statebind-invalid-validation.json
          grep -q "vague_handle" statebind-invalid-validation.sarif
          grep -q "vague_handle" statebind-invalid-summary.md
          grep -q "StateBind Guard Report" statebind-invalid-report.html
