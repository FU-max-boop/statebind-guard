name: Bug report
description: Report an incorrect validation result or tooling failure.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command that failed.
      render: bash
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the relevant output. Remove private paths and secrets.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StateBind Guard version
      placeholder: v0.1.30
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
