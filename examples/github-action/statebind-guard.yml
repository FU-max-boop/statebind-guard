name: statebind-guard

on:
  pull_request:
  push:

jobs:
  statebind-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check handoff
        run: python statebind_handoff/statebind_handoff.py check HANDOFF.md
