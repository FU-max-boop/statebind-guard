<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">StateBind Guard social preview</title>
  <desc id="desc">Social preview for StateBind Guard, a CI guard for executable coding-agent handoffs.</desc>
  <rect width="1200" height="630" fill="#10131a"/>
  <rect x="44" y="44" width="1112" height="542" rx="26" fill="#f8fafc"/>
  <rect x="44" y="44" width="1112" height="132" rx="26" fill="#102033"/>
  <rect x="44" y="140" width="1112" height="46" fill="#102033"/>

  <text x="92" y="112" fill="#e9fbf8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="800">StateBind Guard</text>
  <text x="92" y="151" fill="#a7f3d0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700">CI guard for executable coding-agent handoffs</text>
  <text x="92" y="254" fill="#16181d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="58" font-weight="850">Make handoffs executable.</text>
  <text x="92" y="306" fill="#4b5563" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25">Catch visible-but-unbound files, tests, PRs, SHAs, and artifacts</text>
  <text x="92" y="338" fill="#4b5563" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25">before the next coding agent acts on the wrong object.</text>

  <g transform="translate(92 388)">
    <rect width="292" height="104" rx="12" fill="#ffffff" stroke="#d9dee7"/>
    <rect x="18" y="18" width="44" height="44" rx="9" fill="#fee2e2"/>
    <text x="29" y="50" fill="#b42318" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">!</text>
    <text x="78" y="42" fill="#16181d" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="760">Visible is not bound</text>
    <text x="78" y="74" fill="#5d6472" font-family="Inter, ui-sans-serif, system-ui" font-size="17">same SHA, wrong role</text>
  </g>

  <g transform="translate(416 388)">
    <rect width="292" height="104" rx="12" fill="#ffffff" stroke="#d9dee7"/>
    <rect x="18" y="18" width="44" height="44" rx="9" fill="#dcfce7"/>
    <text x="27" y="50" fill="#0e766e" font-family="Menlo, Consolas, monospace" font-size="25" font-weight="700">#</text>
    <text x="78" y="42" fill="#16181d" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="760">Role-bound handles</text>
    <text x="78" y="74" fill="#5d6472" font-family="Inter, ui-sans-serif, system-ui" font-size="17">test, file, PR, artifact</text>
  </g>

  <g transform="translate(740 388)">
    <rect width="292" height="104" rx="12" fill="#ffffff" stroke="#d9dee7"/>
    <rect x="18" y="18" width="44" height="44" rx="9" fill="#ffedd5"/>
    <text x="28" y="50" fill="#b35c00" font-family="Menlo, Consolas, monospace" font-size="25" font-weight="700">&gt;</text>
    <text x="78" y="42" fill="#16181d" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="760">CLI + Action + SARIF</text>
    <text x="78" y="74" fill="#5d6472" font-family="Inter, ui-sans-serif, system-ui" font-size="17">30-second CI adoption</text>
  </g>

  <rect x="92" y="526" width="1016" height="1" fill="#d9dee7"/>
  <text x="92" y="562" fill="#334155" font-family="Menlo, Consolas, monospace" font-size="20">statebind init --goal "keep coding-agent handoffs executable" --next-command "make test"</text>
</svg>
